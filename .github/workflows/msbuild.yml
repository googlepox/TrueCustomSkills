name: Build OBSE Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout xOBSE SDK
        uses: actions/checkout@v4
        with:
          repository: llde/xOBSE
          ref: master

      - name: Checkout plugin source
        uses: actions/checkout@v4
        with:
          path: TrueCustomSkills

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild TrueCustomSkills/TrueCustomSkills.slnx /p:Configuration=Release /p:Platform=x86 /m

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-dll
          path: TrueCustomSkills/Release/*.dll
